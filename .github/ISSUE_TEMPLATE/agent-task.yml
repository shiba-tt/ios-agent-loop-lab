name: Agent Task
description: AI エージェントに任せるタスク(ループのトリガー)。loop/loop-spec.yaml の trigger に対応
title: "[agent] "
labels: ["agent:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: ゴール
      description: 何ができたら完了か(1〜3 行)
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: 完了条件(検証方法)
      description: エージェントが自分で確認できる形で書く(テストケース、コマンド、期待される出力)。境界条件は「含む/含まない」まで、長さ・個数は単位(書記素/スカラ等)まで明記 — 未指定の細部はエージェントが既定を選びレビューに委ねる運用(E01 で確立)。ここが曖昧だとループは回らない
      placeholder: |
        例:
        - SemanticVersion("1.2.3-beta.1") が parse でき、1.2.3-beta.1 < 1.2.3 になる
        - 表示期間は両端を含む(from ちょうど・to ちょうども表示対象)
        - swift test --package-path packages/AppCore が green
    validations:
      required: true
  - type: dropdown
    id: change-class
    attributes:
      label: 想定変更クラス
      description: loop/approval-policy.md 参照
      options:
        - "C0: docs / experiments / metrics"
        - "C1: packages のコード・テスト"
        - "C2: workflows / 依存 / 設計 / loop 定義"
        - "C3: Apple 境界(エージェントはドラフトまで)"
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 制約・停止条件
      description: 触ってはいけない領域、試行回数上限など。空欄なら loop/loop-spec.yaml の既定値
  - type: textarea
    id: refs
    attributes:
      label: 参照
      description: 関連する docs / experiments / Issue / PR
